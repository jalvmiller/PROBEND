server {
    listen 80;
    server_name _;

    # Permitir uploads de imagens/arquivos de até 20MB
    client_max_body_size 20M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redireciona todas as rotas para o index.html (suporte a React Router)
        try_files $uri $uri/ /index.html;
    }

    # Otimização de cache para assets estáticos
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
