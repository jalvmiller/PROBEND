spring.application.name=application

# Perfil padrão de execução quando nenhum for especificado (ex: ao rodar localmente no host)
spring.profiles.default=dev

# Config Server
server.port=8080
server.servlet.context-path=/api


# ==================== Definições do MySQL ====================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:probend_db}?useSSL=${DB_USE_SSL:false}&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true

# Definições usadas antes da adequação ao modelo do docker:
# spring.datasource.url=jdbc:mysql://localhost:3306/probend_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true

# ==================== Spring e Docker ====================
# Placeholders spring e jwt
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root1234}
jwt.secret=${JWT_SECRET:}
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:false}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Para assegurar que o spring-devtools funcione (live reload, hot reload)
# Em produção, definir SPRING_DEVTOOLS_ENABLED=false
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_ENABLED:true}

# ==================== Conexão com RabbitMQ ====================
# Configurações do RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Configuração de email (Protocolo SMTP)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}

# ==================== Gemini API ====================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-3.5-flash}

# ==================== AWS S3 (MinIO) ====================
# Configurações do S3 para conexão local (MinIO)
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadminpassword}
minio.bucket-name=probend-imagens

# Configurações de tamanho limite para Upload de arquivos (Multipart)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ==================== Spring Boot Actuator ====================
# Expõe todos os endpoints do actuator (health, metrics, env, etc)
# Usado pelo VSCode no "testing", é uma dashboard de monitoramento HTTP
# dá pra ser acessado pelo navegador
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.jmx.enabled=true


# ==================== JPA, Hibernate ====================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Desabilita a geração automática do Hibernate em favor do Flyway
# O valor 'validate' faz o Hibernate validar o estado do banco de dados
# em relação às entidades mapeadas no código. Se houver qualquer divergência
# (como uma coluna faltando, tipo de coluna incompatível ou constraint violada),
# o Spring Boot não iniciará, exibindo um erro detalhado.
spring.jpa.hibernate.ddl-auto=validate
# Em produção, definir JPA_SHOW_SQL=false para não expor queries nos logs
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:true}


