# ==============================================================================
# PERFIL PROD: Execução no Docker (EC2 ou teste full local)
# Conecta diretamente via rede interna do Docker (DNS dos contêineres: db, redis, etc.)
# ==============================================================================

# ==================== MySQL (Rede Interna: db:3306) ====================
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:probend_db}?useSSL=${DB_USE_SSL:false}&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root1234}

# ==================== RabbitMQ (Rede Interna) ====================
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ==================== Redis (Rede Interna) ====================
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# ==================== Mail (Mailpit ou SMTP de Produção) ====================
spring.mail.host=${SPRING_MAIL_HOST:mailpit}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}

# ==================== MinIO / S3 (Rede Interna) ====================
minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadminpassword}

# ==================== Segurança de Produção ====================
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:5173}
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:true}

# ==================== Otimização de Produção ====================
# Desativa DevTools e oculta queries SQL dos logs em produção
spring.devtools.restart.enabled=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
