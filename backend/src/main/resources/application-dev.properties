# ==============================================================================
# PERFIL DEV: Execução Local no Host (fora do contêiner Docker)
# Conecta aos serviços expostos no localhost pelo docker-compose (profile infra)
# ==============================================================================

# ==================== MySQL (Porta 3307 do Host) ====================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:probend_db}?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root1234}

# ==================== RabbitMQ Local ====================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ==================== Redis Local ====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ==================== Mailpit (SMTP Local) ====================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ==================== MinIO (S3 Local) ====================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadminpassword}

# ==================== Segurança / CORS ====================
# Permite tanto o Vite em dev (5173) quanto o contêiner do frontend (8081)
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:false}

# ==================== Ferramentas de Desenvolvimento ====================
# Hot-reload com Spring Boot DevTools ativo
spring.devtools.restart.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
