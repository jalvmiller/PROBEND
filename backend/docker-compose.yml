version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: probend-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: probend_db
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-11T06-46-16Z
    container_name: probend-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: probend-backend
    working_dir: /app
    # Até a linha 35, hot reload para desenvolvimento.. mudar na produção
    # Executa o Spring Boot dentro do container, em modo de desenvolvimento
    command: sh -c "./mvnw spring-boot:run"
    volumes:
      # Volume bind, dá para montar o código dentro do container
      # O docker não fica dependente do JAR, pode ter hot reload
      - ./:/app
      - ~/.m2/repository:/root/.m2/repository
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/probend_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root1234
      JWT_SECRET: ChavePadraoParaDesenvolvimentoApenas
    restart: unless-stopped

# Persistencia dos dados -> Volume
volumes:
  db_data:
  minio_data:
