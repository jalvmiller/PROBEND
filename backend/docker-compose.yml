version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: probend-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: probend_db
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: probend-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/probend_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root1234
      JWT_SECRET: ChavePadraoParaDesenvolvimentoApenas
    restart: unless-stopped

# Persistencia dos dados -> Volume
volumes:
  db_data:
