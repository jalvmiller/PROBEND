<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Fundo Minimalista Deep Slate -->
  <rect width="120" height="120" rx="26" fill="#090d14" />
  <rect width="120" height="120" rx="26" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- Logomarca Minimalista PB (Integral + Curva Âmbar + Prompt Ciano) -->
  <g transform="translate(6, 4)">
    <!-- 1. Haste Integral (Branco / ∫) -->
    <path d="M 40 22 L 40 70 C 40 83, 28 91, 18 85" 
          fill="none" 
          stroke="#f8fafc" 
          stroke-width="9.5" 
          stroke-linecap="round" />

    <!-- 2. Arco Matemático (Âmbar / P) -->
    <path d="M 54 22 L 70 22 C 81 22, 89 28.5, 89 37.5 C 89 46.5, 81 53, 70 53 L 54 53" 
          fill="none" 
          stroke="#f59e0b" 
          stroke-width="9.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 3. Chevron Algorítmico (Ciano / Prompt > / B) -->
    <path d="M 54 65 L 76 76 L 54 87" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="8.5" 
          stroke-linecap="round" 
