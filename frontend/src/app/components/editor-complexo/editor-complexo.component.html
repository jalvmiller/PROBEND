<div class="editor-fullscreen-overlay">
  <!-- Barra de Topo Fixa (Header do Editor) -->
  <app-editor-header
    [badgeModo]="badgeModo"
    [titulo]="titulo"
    [subtitulo]="subtitulo"
    [modoAtivo]="modoAtivo()"
    [mostrarVerEnunciado]="mostrarVerEnunciado"
    [enunciadoAberto]="enunciadoAberto()"
    [totalLinhas]="totalLinhas()"
    [totalCaracteres]="totalCaracteres()"
    [selectedPdfFile]="selectedPdfFile()"
    [submetendo]="submetendo()"
    [textoBotaoAcao]="textoBotaoAcao"
    [podeSubmeter]="!!conteudo().trim() || !!trechoCodigo().trim()"
    (fechar)="minimizarEFechar()"
    (modoAlterado)="alternarModo($event)"
    (alternarEnunciado)="toggleEnunciado()"
    (abrirGuia)="abrirModalGuia()"
    (pdfSelecionado)="onPdfSelected($event)"
    (removerPdf)="removerArquivoPdf()"
    (submeter)="submeter()"
  ></app-editor-header>

  <!-- Drawer Deslizante de Enunciado -->
  @if (mostrarVerEnunciado) {
    <app-editor-enunciado-drawer
      [aberto]="enunciadoAberto()"
      [enunciado]="enunciadoOriginal"
      [codigoOriginal]="codigoOriginal"
      (fechar)="enunciadoAberto.set(false)"
    ></app-editor-enunciado-drawer>
  }

  <!-- Corpo Principal: Split-Screen Lado a Lado -->
  <main class="editor-workspace">
    <!-- ==================================================== -->
    <!-- MODO MATEMÁTICA (LaTeX)                              -->
    <!-- ==================================================== -->
    @if (modoAtivo() === 'MATEMATICA') {
      <div class="split-screen">
        <app-editor-math-pane
          #mathPane
          [conteudo]="conteudo()"
          [placeholderMatematica]="placeholderMatematica()"
          (conteudoChange)="conteudo.set($event)"
          (cursorAlterado)="sincronizarPaginaComCursor($event)"
          (linhaAlterada)="sincronizarPaginaComLinha($event)"
        ></app-editor-math-pane>

        <app-editor-documento-preview
          [conteudo]="conteudo()"
          [trechoCodigo]="trechoCodigo()"
          [linguagemCodigo]="linguagemCodigo()"
          [titulo]="titulo"
          [subtitulo]="subtitulo"
          [autorExibicao]="autorExibicao()"
          [paginas]="paginas()"
          [paginaAtualIndex]="paginaAtualIndex()"
          [modoVisualizacao]="modoVisualizacao()"
          (paginaAtualIndexChange)="paginaAtualIndex.set($event)"
          (modoVisualizacaoChange)="modoVisualizacao.set($event)"
          (adicionarPagina)="inserirQuebraPagina()"
        ></app-editor-documento-preview>
      </div>
    }

    <!-- ==================================================== -->
    <!-- MODO ALGORITMO / CÓDIGO                              -->
    <!-- ==================================================== -->
    @if (modoAtivo() === 'ALGORITMO') {
      <div class="split-screen">
        <app-editor-code-pane
          [trechoCodigo]="trechoCodigo()"
          [linguagemCodigo]="linguagemCodigo()"
          [placeholderCodigo]="placeholderCodigo()"
          [conteudoExplicacao]="conteudo()"
          (trechoCodigoChange)="trechoCodigo.set($event)"
          (linguagemCodigoChange)="linguagemCodigo.set($event)"
          (conteudoExplicacaoChange)="conteudo.set($event)"
        ></app-editor-code-pane>

        <app-editor-code-preview
          [trechoCodigo]="trechoCodigo()"
          [linguagemCodigo]="linguagemCodigo()"
          [codigoDestacado]="codigoDestacado()"
          [conteudoExplicacao]="conteudo()"
        ></app-editor-code-preview>
      </div>
    }
  </main>

  <!-- Modal de Guia do Editor -->
  <app-editor-guia-modal
    [aberto]="modalGuiaAberto()"
    (fechar)="fecharModalGuia()"
  ></app-editor-guia-modal>
</div>
