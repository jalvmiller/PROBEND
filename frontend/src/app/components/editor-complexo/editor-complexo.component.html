<div class="editor-fullscreen-overlay">
  <!-- Barra de Topo Fixa (Header do Editor) -->
  <app-editor-header
    [badgeModo]="badgeModo"
    [titulo]="titulo"
    [subtitulo]="subtitulo"
    [modoAtivo]="modoAtivo()"
    [mostrarVerEnunciado]="mostrarVerEnunciado && modoAtivo() === 'MATEMATICA'"
    [enunciadoAberto]="enunciadoAberto()"
    [totalLinhas]="totalLinhas()"
    [totalCaracteres]="totalCaracteres()"
    [selectedPdfFile]="selectedPdfFile()"
    [submetendo]="submetendo()"
    [textoBotaoAcao]="textoBotaoAcao"
    [podeSubmeter]="!!conteudo().trim() || !!trechoCodigo().trim()"
    (fechar)="minimizarEFechar()"
    (modoAlterado)="alternarModo($event)"
    (alternarEnunciado)="toggleEnunciado()"
    (abrirGuia)="abrirModalGuia()"
    (pdfSelecionado)="onPdfSelected($event)"
    (removerPdf)="removerArquivoPdf()"
    (submeter)="submeter()"
  ></app-editor-header>

  <!-- Drawer Deslizante de Enunciado (só no Modo Matemática; no Algoritmo o enunciado fica no painel direito) -->
  @if (mostrarVerEnunciado && modoAtivo() === 'MATEMATICA') {
    <app-editor-enunciado-drawer
      [aberto]="enunciadoAberto()"
      [enunciado]="enunciadoOriginal"
      [codigoOriginal]="codigoOriginal"
      (fechar)="enunciadoAberto.set(false)"
    ></app-editor-enunciado-drawer>
  }

  <!-- Corpo Principal: Split-Screen Lado a Lado -->
  <main class="editor-workspace">
    <!-- ==================================================== -->
    <!-- MODO MATEMÁTICA (LaTeX)                              -->
    <!-- ==================================================== -->
    @if (modoAtivo() === 'MATEMATICA') {
      <div
        class="split-workspace"
        [class.redimensionando]="redimensionando()"
        [style.--largura-editor]="larguraEditorPct() + '%'"
      >
        <!-- PAINEL ESQUERDO: Editor LaTeX com Toolbar e MathLive Retrátil -->
        <div class="painel painel-editor-col">
          <app-editor-math-pane
            #mathPane
            [conteudo]="conteudo()"
            [placeholderMatematica]="placeholderMatematica()"
            (conteudoChange)="conteudo.set($event)"
            (cursorAlterado)="sincronizarPaginaComCursor($event)"
            (linhaAlterada)="sincronizarPaginaComLinha($event)"
          ></app-editor-math-pane>
        </div>

        <!-- DIVISOR ARRASTÁVEL (Splitter com suporte a mouse e teclado) -->
        <div
          class="divisor"
          appSplitResizer
          containerSelector=".split-workspace"
          [minLeftPct]="LARGURA_MIN_PCT"
          [maxLeftPct]="LARGURA_MAX_PCT"
          (resizePct)="larguraEditorPct.set($event)"
          (resizeStart)="redimensionando.set(true)"
          (resizeEnd)="finalizarRedimensionamento()"
          (keydown)="redimensionarPorTeclado($event)"
          tabindex="0"
          role="separator"
          aria-orientation="vertical"
          aria-label="Redimensionar editor e documento"
          [attr.aria-valuenow]="larguraEditorArredondada()"
          [attr.aria-valuemin]="LARGURA_MIN_PCT"
          [attr.aria-valuemax]="LARGURA_MAX_PCT"
          title="Arraste ou use as setas ← → para redimensionar"
        >
          <div class="divisor-linha"></div>
        </div>

        <!-- PAINEL DIREITO: Documento Paginado e Prévia KaTeX -->
        <div class="painel painel-preview-col">
          <app-editor-documento-preview
            [conteudo]="conteudo()"
            [trechoCodigo]="trechoCodigo()"
            [linguagemCodigo]="linguagemCodigo()"
            [titulo]="titulo"
            [subtitulo]="subtitulo"
            [autorExibicao]="autorExibicao()"
            [paginas]="paginas()"
            [paginaAtualIndex]="paginaAtualIndex()"
            [modoVisualizacao]="modoVisualizacao()"
            (paginaAtualIndexChange)="paginaAtualIndex.set($event)"
            (modoVisualizacaoChange)="modoVisualizacao.set($event)"
            (adicionarPagina)="inserirQuebraPagina()"
          ></app-editor-documento-preview>
        </div>
      </div>
    }

    <!-- ==================================================== -->
    <!-- MODO ALGORITMO / CÓDIGO                              -->
    <!-- ==================================================== -->
    @if (modoAtivo() === 'ALGORITMO') {
      <div
        class="split-workspace"
        [class.redimensionando]="redimensionando()"
        [style.--largura-editor]="larguraEditorPct() + '%'"
      >
        <!-- PAINEL ESQUERDO: Ambiente de Código -->
        <div class="painel painel-editor-col">
          <app-editor-code-pane
            [trechoCodigo]="trechoCodigo()"
            [linguagemCodigo]="linguagemCodigo()"
            [placeholderCodigo]="placeholderCodigo()"
            (trechoCodigoChange)="trechoCodigo.set($event)"
          ></app-editor-code-pane>
        </div>

        <!-- DIVISOR ARRASTÁVEL (mouse via diretiva, teclado via setas) -->
        <div
          class="divisor"
          appSplitResizer
          containerSelector=".split-workspace"
          [minLeftPct]="LARGURA_MIN_PCT"
          [maxLeftPct]="LARGURA_MAX_PCT"
          (resizePct)="larguraEditorPct.set($event)"
          (resizeStart)="redimensionando.set(true)"
          (resizeEnd)="finalizarRedimensionamento()"
          (keydown)="redimensionarPorTeclado($event)"
          tabindex="0"
          role="separator"
          aria-orientation="vertical"
          aria-label="Redimensionar editor e contexto do problema"
          [attr.aria-valuenow]="larguraEditorArredondada()"
          [attr.aria-valuemin]="LARGURA_MIN_PCT"
          [attr.aria-valuemax]="LARGURA_MAX_PCT"
          title="Arraste ou use as setas ← → para redimensionar"
        >
          <div class="divisor-linha"></div>
        </div>

        <!-- PAINEL DIREITO: Contexto do Problema -->
        <div class="painel painel-preview-col">
          <app-editor-contexto-problema
            [titulo]="titulo"
            [subtitulo]="subtitulo"
            [enunciado]="enunciadoOriginal"
            [codigoOriginal]="codigoOriginal"
            [anotacoes]="conteudo()"
            (anotacoesChange)="conteudo.set($event)"
          ></app-editor-contexto-problema>
        </div>
      </div>
    }
  </main>

  <!-- Modal de Guia do Editor -->
  <app-editor-guia-modal
    [aberto]="modalGuiaAberto()"
    (fechar)="fecharModalGuia()"
  ></app-editor-guia-modal>
</div>
