<div class="layout-app" [class.com-sidebar]="authService.isAuthenticated()">
  <!-- Barra Lateral Retrátil (quando autenticado) -->
  @if (authService.isAuthenticated()) {
    <app-sidebar></app-sidebar>
  }

  <div class="layout-conteudo-wrapper">
    <!-- Barra de Navegação Superior Fixa -->
    <app-header></app-header>

    <!-- Janela de Roteamento SPA -->
    <main class="conteudo-principal">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
